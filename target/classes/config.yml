# Стоимость создания города в ресурсах.
# Формат:
#   cost:
#     MATERIAL: количество
#
# ВАЖНО: в конфиге Towny денежная стоимость создания города
# (economy.new_town_cost / price_newtown) должна быть выставлена в 0,
# иначе игрок заплатит и деньги, и ресурсы.
cost:
  COBBLESTONE: 64
  SPRUCE_PLANKS: 64
  WHITE_WOOL: 8

# Русские названия материалов для сообщений.
# Если материала тут нет — отобразится Material.name() (напр. DIAMOND_SWORD).
material-names:
  COBBLESTONE: "Булыжник"
  SPRUCE_PLANKS: "Еловые доски"
  WHITE_WOOL: "Белая шерсть"
  WHEAT_SEEDS: "Семена пшеницы"
  WATER_BUCKET: "Ведро воды"
  IRON_AXE: "Железный топор"
  IRON_PICKAXE: "Железная кирка"
  IRON_HOE: "Железная мотыга"
  IRON_SHOVEL: "Железная лопата"
  BREAD: "Хлеб"
  OAK_LOG: "Дубовое бревно"
  TORCH: "Факел"
  COOKED_BEEF: "Стейк"

messages:
  not-enough: "<red>Для создания города вам нужно: %cost%"
  success: "<green>Ресурсы за город списаны!"
  creative-bypass: "<green>Вы в креативе, ресурсы не списаны"
  reloaded: "<green>Конфигурация TownyResourceCost успешно перезагружена"
  unknown-subcommand: "<yellow>Неизвестная подкоманда. Используйте /%label% reload"

effects:
  enabled: true

  particle:
    enabled: true
    type: HAPPY_VILLAGER
    count: 60
    radius: 2.5

  firework:
    enabled: true
    count: 3
    power: 1
    type: BALL_LARGE
    colors: ["#FFAA00", "#00FFAA", "#FF55FF"]
    flicker: true
    trail: true

  sound:
    enabled: true
    name: "entity.player.levelup"
    volume: 1.0
    pitch: 1.2

starting-chest:
  enabled: true
  # SPAWN_GROUND — на поверхности рядом со spawn города
  # SPAWN_LEVEL  — на уровне Y спавна (для подземных городов)
  placement: SPAWN_GROUND
  search-radius: 4
  # Список предметов. Поддерживаются enchantments.
  # Старый формат (MATERIAL: количество) тоже работает.
  contents:
    - material: WHEAT_SEEDS
      amount: 16
    - material: WATER_BUCKET
      amount: 1
    - material: IRON_AXE
      amount: 1
      enchantments:
        UNBREAKING: 3
    - material: IRON_PICKAXE
      amount: 1
      enchantments:
        UNBREAKING: 3
    - material: IRON_HOE
      amount: 1
      enchantments:
        UNBREAKING: 3
    - material: IRON_SHOVEL
      amount: 1
      enchantments:
        UNBREAKING: 3
    - material: BREAD
      amount: 16